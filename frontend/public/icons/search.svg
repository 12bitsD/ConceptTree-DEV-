<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="searchGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFB968;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FF9538;stop-opacity:0.3"/>
    </radialGradient>
  </defs>
  
  <g transform="rotate(15 32 32)" stroke-linecap="round" stroke-linejoin="round">
    <!-- 扫描光圈 -->
    <circle cx="28" cy="28" r="14" stroke="#FF9538" stroke-width="1" fill="none" opacity="0">
      <animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 放大镜镜片 - 脉冲 -->
    <circle cx="28" cy="28" r="14" stroke="#FF9538" stroke-width="2.5" fill="url(#searchGlow)">
      <animateTransform
        attributeName="transform"
        type="scale"
        values="1;1.1;1"
        dur="2s"
        repeatCount="indefinite"
        additive="sum"/>
    </circle>
    
    <!-- 内圈装饰 -->
    <circle cx="28" cy="28" r="10" stroke="#FF9538" stroke-width="1.5" fill="none" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- 镜柄 - 延伸动画 -->
    <line x1="37.8" y1="37.8" x2="50" y2="50" stroke="#FF9538" stroke-width="3" stroke-linecap="round">
      <animate attributeName="x2" values="50;52;50" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="50;52;50" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="3;4;3" dur="1.5s" repeatCount="indefinite"/>
    </line>

    <!-- < 代码符号 - 闪烁移动 -->
    <polyline points="22,28 20,26 22,24" stroke="#16AA98" stroke-width="2.5" fill="none">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; -1,0; 0,0"
        dur="1.5s"
        repeatCount="indefinite"/>
    </polyline>

    <!-- > 代码符号 - 闪烁移动 -->
    <polyline points="34,24 36,26 34,28" stroke="#16AA98" stroke-width="2.5" fill="none">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; 1,0; 0,0"
        dur="1.5s"
        repeatCount="indefinite"
        begin="0.75s"/>
    </polyline>
    
    <!-- 扫描线 -->
    <line x1="23" y1="28" x2="33" y2="28" stroke="#16AA98" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="23;24;23" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="33;32;33" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
