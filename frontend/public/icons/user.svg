<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="userGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9538;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF7518;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 外圈脉冲 -->
    <circle cx="32" cy="20" r="8" stroke="#FF9538" stroke-width="1" fill="none" opacity="0">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 头像：头部 - 呼吸效果 -->
    <circle cx="32" cy="20" r="8" stroke="url(#userGradient)" stroke-width="2.5" fill="rgba(255,149,56,0.2)">
      <animateTransform
        attributeName="transform"
        type="scale"
        values="1;1.08;1"
        dur="3s"
        repeatCount="indefinite"
        additive="sum"/>
    </circle>
    
    <!-- 脸部细节 - 眼睛 -->
    <g opacity="0.8">
      <circle cx="29" cy="19" r="1.2" fill="#2d2d2d">
        <animate attributeName="ry" values="1.2;0.3;1.2;1.2" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="35" cy="19" r="1.2" fill="#2d2d2d">
        <animate attributeName="ry" values="1.2;0.3;1.2;1.2" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- 微笑 -->
    <path d="M29 22c1 1 2 1.5 3 1.5s2-0.5 3-1.5" stroke="#2d2d2d" stroke-width="1.5" fill="none">
      <animate attributeName="d" 
        values="M29 22c1 1 2 1.5 3 1.5s2-0.5 3-1.5;
                M29 21.5c1 1.5 2 2 3 2s2-0.5 3-2;
                M29 22c1 1 2 1.5 3 1.5s2-0.5 3-1.5"
        dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- 身体：肩膀轮廓 - 上升动画 -->
    <path d="M20 46c0-6.6 5.4-12 12-12s12 5.4 12 12" 
          stroke="url(#userGradient)" stroke-width="2.5" fill="none">
      <animate attributeName="d" 
        values="M20 46c0-6.6 5.4-12 12-12s12 5.4 12 12;
                M20 45c0-6.6 5.4-12 12-12s12 5.4 12 12;
                M20 46c0-6.6 5.4-12 12-12s12 5.4 12 12"
        dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- 身体填充 - 渐变出现 -->
    <path d="M20 46c0-6.6 5.4-12 12-12s12 5.4 12 12" 
          stroke="none" fill="rgba(255,149,56,0.1)">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- 左括号 {} 装饰 - 跳动 -->
    <g transform-origin="14 23">
      <path d="M16 20c-1 1-2 2-2 3s1 2 2 3" stroke="#16AA98" stroke-width="2.5" fill="none">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; -1,0; 0,0"
        dur="2s"
        repeatCount="indefinite"/>
    </g>
    
    <!-- 右括号 {} 装饰 - 跳动 -->
    <g transform-origin="50 23">
      <path d="M48 20c1 1 2 2 2 3s-1 2-2 3" stroke="#16AA98" stroke-width="2.5" fill="none">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="1s"/>
      </path>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; 1,0; 0,0"
        dur="2s"
        repeatCount="indefinite"
        begin="1s"/>
    </g>
    
    <!-- 头顶光环 -->
    <circle cx="32" cy="12" r="3" stroke="#FFD700" stroke-width="1.5" fill="none" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;3.5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
