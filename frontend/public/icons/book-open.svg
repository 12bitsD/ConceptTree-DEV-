<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9538;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF7518;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <g stroke="url(#bookGradient)" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左页 - 翻页动画 -->
    <g opacity="1">
      <path d="M12 16c6 0 12 2 20 6v26c-8-4-14-6-20-6V16z" 
            fill="rgba(255,149,56,0.1)" stroke-width="2.5">
        <animate attributeName="d" 
          values="M12 16c6 0 12 2 20 6v26c-8-4-14-6-20-6V16z;
                  M12 16c6 0 12 2 19 6v26c-7-4-13-6-19-6V16z;
                  M12 16c6 0 12 2 20 6v26c-8-4-14-6-20-6V16z"
          dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
      </path>
      
      <!-- 左页文字线 - 依次出现 -->
      <line x1="16" y1="22" x2="26" y2="22" stroke-width="2">
        <animate attributeName="x2" values="16;26;26;26" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="16" y1="28" x2="26" y2="28" stroke-width="2">
        <animate attributeName="x2" values="16;26;26;26" dur="4s" repeatCount="indefinite" begin="0.5s"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="4s" repeatCount="indefinite" begin="0.5s"/>
      </line>
      <line x1="16" y1="34" x2="26" y2="34" stroke-width="2">
        <animate attributeName="x2" values="16;26;26;26" dur="4s" repeatCount="indefinite" begin="1s"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="4s" repeatCount="indefinite" begin="1s"/>
      </line>
    </g>

    <!-- 右页 - 翻页动画 -->
    <g opacity="1">
      <path d="M52 16c-6 0-12 2-20 6v26c8-4 14-6 20-6V16z" 
            fill="rgba(255,149,56,0.1)" stroke-width="2.5">
        <animate attributeName="d" 
          values="M52 16c-6 0-12 2-20 6v26c8-4 14-6 20-6V16z;
                  M52 16c-6 0-12 2-21 6v26c9-4 15-6 21-6V16z;
                  M52 16c-6 0-12 2-20 6v26c8-4 14-6 20-6V16z"
          dur="3s" repeatCount="indefinite" begin="1.5s"/>
        <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite" begin="1.5s"/>
      </path>
      
      <!-- 右页文字线 - 依次出现 -->
      <line x1="38" y1="22" x2="48" y2="22" stroke-width="2">
        <animate attributeName="x2" values="38;48;48;48" dur="4s" repeatCount="indefinite" begin="1.5s"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="4s" repeatCount="indefinite" begin="1.5s"/>
      </line>
      <line x1="38" y1="28" x2="48" y2="28" stroke-width="2">
        <animate attributeName="x2" values="38;48;48;48" dur="4s" repeatCount="indefinite" begin="2s"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="4s" repeatCount="indefinite" begin="2s"/>
      </line>
      <line x1="38" y1="34" x2="48" y2="34" stroke-width="2">
        <animate attributeName="x2" values="38;48;48;48" dur="4s" repeatCount="indefinite" begin="2.5s"/>
        <animate attributeName="opacity" values="0;1;1;1" dur="4s" repeatCount="indefinite" begin="2.5s"/>
      </line>
    </g>
    
    <!-- 中缝 -->
    <line x1="32" y1="22" x2="32" y2="48" stroke="#FF9538" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite"/>
    </line>
    
    <!-- 书签 -->
    <rect x="30" y="10" width="4" height="10" fill="#16AA98" rx="1">
      <animate attributeName="y" values="10;12;10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </rect>
    
    <!-- 阅读光效 -->
    <ellipse cx="32" cy="32" rx="18" ry="14" fill="#FFD700" opacity="0">
      <animate attributeName="opacity" values="0;0.15;0" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
