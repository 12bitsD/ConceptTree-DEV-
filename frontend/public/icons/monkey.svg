<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="monkeyGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFB968;stop-opacity:1">
        <animate attributeName="stop-opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FF9538;stop-opacity:0.3"/>
    </radialGradient>
  </defs>
  
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 外层脉冲光环 -->
    <circle cx="32" cy="32" r="18" stroke="#FF9538" stroke-width="1.5" fill="none" opacity="0">
      <animate attributeName="r" values="18;24;18" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1.5;0.5;1.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 主脸部轮廓 - 带弹跳 -->
    <circle cx="32" cy="32" r="16" stroke="#FF9538" stroke-width="3" fill="url(#monkeyGlow)">
      <animateTransform
        attributeName="transform"
        type="scale"
        values="1;1.05;1"
        dur="2s"
        repeatCount="indefinite"
        additive="sum"/>
    </circle>
    
    <!-- 左耳 - 摇摆 -->
    <g transform-origin="14 28">
      <circle cx="14" cy="28" r="6" stroke="#FF9538" stroke-width="2.5" fill="rgba(255,149,56,0.3)"/>
      <circle cx="14" cy="28" r="3.5" stroke="#FF9538" stroke-width="1.5" fill="rgba(255,149,56,0.5)"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="-10 14 28; 10 14 28; -10 14 28"
        dur="3s"
        repeatCount="indefinite"/>
    </g>
    
    <!-- 右耳 - 摇摆 -->
    <g transform-origin="50 28">
      <circle cx="50" cy="28" r="6" stroke="#FF9538" stroke-width="2.5" fill="rgba(255,149,56,0.3)"/>
      <circle cx="50" cy="28" r="3.5" stroke="#FF9538" stroke-width="1.5" fill="rgba(255,149,56,0.5)"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="10 50 28; -10 50 28; 10 50 28"
        dur="3s"
        repeatCount="indefinite"/>
    </g>
    
    <!-- 左眼 - 眨眼 -->
    <ellipse cx="26" cy="30" rx="3" ry="3" fill="#2d2d2d">
      <animate attributeName="ry" values="3;0.5;3;3;3" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="27" cy="29" r="1.2" fill="white" opacity="0.9"/>
    
    <!-- 右眼 - 眨眼 -->
    <ellipse cx="38" cy="30" rx="3" ry="3" fill="#2d2d2d">
      <animate attributeName="ry" values="3;0.5;3;3;3" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="39" cy="29" r="1.2" fill="white" opacity="0.9"/>
    
    <!-- 鼻子 -->
    <ellipse cx="32" cy="36" rx="2" ry="1.5" fill="#FF7518">
      <animate attributeName="ry" values="1.5;2;1.5" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- 微笑 - 动态变化 -->
    <path stroke="#2d2d2d" stroke-width="2.5" stroke-linecap="round" fill="none">
      <animate attributeName="d" 
        values="M22 40c2 3 6 5 10 5s8-2 10-5;
                M22 39c2 4 6 6 10 6s8-2 10-6;
                M22 40c2 3 6 5 10 5s8-2 10-5"
        dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- 代码括号 - 左 -->
    <g opacity="1">
      <path d="M16 22c-1.5 0-2.5 1-2.5 2.5v3c0 1.5 1 2.5 2.5 2.5" 
            stroke="#16AA98" stroke-width="2.5" fill="none" stroke-linecap="round">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
        <animateTransform
          attributeName="transform"
          type="translate"
          values="0,0; -2,0; 0,0"
          dur="2s"
          repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- 代码括号 - 右 -->
    <g opacity="1">
      <path d="M48 22c1.5 0 2.5 1 2.5 2.5v3c0 1.5-1 2.5-2.5 2.5" 
            stroke="#16AA98" stroke-width="2.5" fill="none" stroke-linecap="round">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="1s"/>
        <animateTransform
          attributeName="transform"
          type="translate"
          values="0,0; 2,0; 0,0"
          dur="2s"
          repeatCount="indefinite"
          begin="1s"/>
      </path>
    </g>
    
    <!-- 装饰星星 -->
    <g>
      <circle cx="10" cy="18" r="2" fill="#16AA98">
        <animate attributeName="r" values="2;3;2" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="54" cy="18" r="2" fill="#FF9538">
        <animate attributeName="r" values="2;3;2" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
      </circle>
    </g>
  </g>
</svg>
