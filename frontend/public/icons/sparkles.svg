<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sparkleGradient1" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9538;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="sparkleGradient2" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#00FFCC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16AA98;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 中心大星星（旋转+缩放） -->
    <g transform-origin="32 32">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 32 32"
        to="360 32 32"
        dur="4s"
        repeatCount="indefinite"/>
      
      <!-- 外层光晕 -->
      <path d="M32 16l4 8l8 4l-8 4l-4 8l-4-8l-8-4l8-4z" 
            stroke="url(#sparkleGradient1)" 
            stroke-width="3" 
            fill="none" 
            opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
        <animateTransform
          attributeName="transform"
          type="scale"
          values="1;1.15;1"
          additive="sum"
          dur="2s"
          repeatCount="indefinite"/>
      </path>
      
      <!-- 主星星 -->
      <path d="M32 16l4 8l8 4l-8 4l-4 8l-4-8l-8-4l8-4z" 
            stroke="url(#sparkleGradient1)" 
            stroke-width="2.5" 
            fill="rgba(255,149,56,0.2)" />
      
      <!-- 内部高光 -->
      <path d="M32 22l2 4l4 2l-4 2l-2 4l-2-4l-4-2l4-2z" 
            fill="white" 
            opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- 左上小星星（闪烁+位移） -->
    <g transform-origin="16 20">
      <path d="M16 16l2 4l4 2l-4 2l-2 4l-2-4l-4-2l4-2z" 
            stroke="url(#sparkleGradient2)" 
            stroke-width="2" 
            fill="rgba(22,170,152,0.3)">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0s"/>
        <animateTransform
          attributeName="transform"
          type="scale"
          values="0.5;1;0.5"
          dur="2s"
          repeatCount="indefinite"
          begin="0s"/>
      </path>
    </g>
    
    <!-- 右上小星星 -->
    <g transform-origin="48 12">
      <path d="M48 8l2 4l4 2l-4 2l-2 4l-2-4l-4-2l4-2z" 
            stroke="url(#sparkleGradient2)" 
            stroke-width="2" 
            fill="rgba(22,170,152,0.3)">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.4s"/>
        <animateTransform
          attributeName="transform"
          type="scale"
          values="0.5;1;0.5"
          dur="2s"
          repeatCount="indefinite"
          begin="0.4s"/>
      </path>
    </g>
    
    <!-- 右下小星星 -->
    <g transform-origin="52 48">
      <path d="M52 44l2 4l4 2l-4 2l-2 4l-2-4l-4-2l4-2z" 
            stroke="url(#sparkleGradient1)" 
            stroke-width="2" 
            fill="rgba(255,149,56,0.3)">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.8s"/>
        <animateTransform
          attributeName="transform"
          type="scale"
          values="0.5;1;0.5"
          dur="2s"
          repeatCount="indefinite"
          begin="0.8s"/>
      </path>
    </g>
    
    <!-- 左下小星星 -->
    <g transform-origin="12 52">
      <path d="M12 48l2 4l4 2l-4 2l-2 4l-2-4l-4-2l4-2z" 
            stroke="url(#sparkleGradient2)" 
            stroke-width="2" 
            fill="rgba(22,170,152,0.3)">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="1.2s"/>
        <animateTransform
          attributeName="transform"
          type="scale"
          values="0.5;1;0.5"
          dur="2s"
          repeatCount="indefinite"
          begin="1.2s"/>
      </path>
    </g>
    
    <!-- 额外的闪光粒子 -->
    <circle cx="24" cy="32" r="1.5" fill="#16AA98">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="40" cy="32" r="1.5" fill="#FF9538">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="32" cy="40" r="1.5" fill="#16AA98">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" begin="2s"/>
    </circle>
  </g>
</svg>
